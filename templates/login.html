<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>Login - Sell & Buy Store</title>
</head>
<body style="font-family: Arial; background: #f2f4f5; text-align: center; padding-top: 50px;">
    <div style="background: white; padding: 30px; display: inline-block; border-radius: 8px; width: 350px;">
        <h2>లాగిన్ / సైన్ అప్</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="మీ ఈమెయిల్ ఇవ్వండి" required style="width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
            <input type="text" name="ref_code" placeholder="రెఫరల్ కోడ్ (ఉంటే ఇక్కడ ఇవ్వండి)" style="width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
            <br>
            <button type="submit" style="background: #002f34; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">OTP పంపు (Send OTP)</button>
        </form>
    </div>
</body>
</html>
