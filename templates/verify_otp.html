<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
</head>
<body style="font-family: Arial; background: #f2f4f5; text-align: center; padding-top: 50px;">
    <div style="background: white; padding: 30px; display: inline-block; border-radius: 8px; width: 350px;">
        <h2>OTP వెరిఫికేషన్</h2>
        <form method="POST">
            <input type="text" name="otp" placeholder="4 అంకెల OTP కోడ్ ఇవ్వండి" required style="width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 18px;">
            <br>
            <button type="submit" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">వెరిఫై & లాగిన్</button>
        </form>
    </div>
</body>
</html>
