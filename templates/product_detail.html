<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>{{ product.title }}</title>
</head>
<body style="font-family: Arial; background: #f2f4f5; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px;">
        <h2>{{ product.title }}</h2>
        <h3 style="color: green;">₹ {{ product.price }}</h3>
        <p><b>లొకేషన్:</b> {{ product.location }}</p>
        <hr>
        <p><b>వివరణ:</b> {{ product.description }}</p>
        <hr>
        <a href="/chat/{{ product.id }}" style="background: #002f34; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px;">Chat with Seller</a>
        <br><br>
        <a href="/" style="color: #002f34; text-decoration: none;">← హోమ్ పేజీకి వెళ్ళండి</a>
    </div>
</body>
</html>
